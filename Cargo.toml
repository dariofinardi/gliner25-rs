[package]
name = "gliner25"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Dario Finardi <df@dariofinardi.it>"]
description = "Native Rust inference engine for GLiNER2.5 boundary-architecture models on ONNX Runtime"
license = "Apache-2.0"
repository = "https://github.com/dariofinardi/gliner25-rs"
homepage = "https://edito-pdf.com"
keywords = ["nlp", "ner", "onnx", "inference", "gliner"]
categories = ["science", "text-processing"]

[dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std", "ndarray", "tracing", "half",
    "load-dynamic",
    "cuda", "rocm", "coreml", "openvino", "directml", "tensorrt", "xnnpack", "qnn",
] }
ndarray = "0.17"
tokenizers = "0.23"
anyhow = "1.0"
half = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
