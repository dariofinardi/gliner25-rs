[package]
name = "gliner25-rs"
version = "0.5.5"
description = "Native Rust inference for GLiNER2.5 on ONNX Runtime: boundary-architecture entity extraction with schema families"
readme = "README.md"
keywords = ["nlp", "ner", "onnx", "inference", "gliner"]
categories = ["science", "text-processing"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
ort.workspace = true
ndarray.workspace = true
tokenizers.workspace = true
anyhow.workspace = true
half.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
hf-hub = { workspace = true, optional = true }

[features]
default = ["families", "hub"]

# Schema families. On by default: anyone passing a wide schema to this model
# wants them, and they are a few helpers with no extra dependencies. A feature
# rather than a separate crate because splitting produced a package that was
# only ever installed alongside the engine.
families = []

# Fetches a published export from the Hub when the model directory is empty.
# On by default: a crate that cannot obtain its own weights makes every caller
# write the same download step. `hf-hub` comes in without default features, so
# TLS resolves through `rustls` and no `openssl` enters the tree. Switching the
# feature off leaves the crate with no network stack at all.
hub = ["dep:hf-hub"]

# Helpers that locate a tokenizer.json under the workspace, for pinning the
# prompt layout against the same ground truth from outside the crate.
test-support = []
