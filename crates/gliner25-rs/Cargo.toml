[package]
name = "gliner25-rs"
version = "0.2.0"
description = "Native Rust inference for GLiNER2.5 on ONNX Runtime: boundary-architecture entity extraction with schema families"
readme = "README.md"
keywords = ["nlp", "ner", "onnx", "inference", "gliner"]
categories = ["science", "text-processing"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
ort.workspace = true
ndarray.workspace = true
tokenizers.workspace = true
anyhow.workspace = true
half.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = ["families"]

# Schema families. On by default: anyone passing a wide schema to this model
# wants them, and they are a few helpers with no extra dependencies. A feature
# rather than a separate crate because splitting produced a package that was
# only ever installed alongside the engine.
families = []

# Helpers that locate a tokenizer.json under the workspace, for pinning the
# prompt layout against the same ground truth from outside the crate.
test-support = []
